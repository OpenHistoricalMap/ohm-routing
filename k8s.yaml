apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graphhopper-data
  namespace: routing-poc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphhopper
  namespace: routing-poc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: graphhopper }
  template:
    metadata:
      labels: { app: graphhopper }
    spec:
      nodeSelector:
        kubernetes.io/hostname: ohm-staging-worker-01
      initContainers:
        - name: build
          image: maven:3.9-eclipse-temurin-21
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [ -f /data/graphhopper-web.jar ] && [ "$(cat /data/src.sha)" = "$(cat /src/*.java | sha256sum)" ]; then
                echo "jar up to date"; exit 0
              fi
              rm -rf /tmp/gh && git clone --quiet --depth 1 --branch 11.1 https://github.com/graphhopper/graphhopper.git /tmp/gh
              cd /tmp/gh
              mkdir -p web-bundle/src/main/java/org/openhistoricalmap/routing
              cp /src/*.java web-bundle/src/main/java/org/openhistoricalmap/routing/
              F=web-bundle/src/main/java/com/graphhopper/http/GraphHopperManaged.java
              sed -i 's|^        graphHopper.init(configuration);|        graphHopper.setImportRegistry(new org.openhistoricalmap.routing.OhmImportRegistry());\n        graphHopper.init(configuration);|' $F
              grep -q OhmImportRegistry $F
              mvn -q -B -DskipTests -pl web -am package
              ls web/target/*.jar
              cp "$(ls web/target/graphhopper-web-*.jar | grep -v -e sources -e original -e javadoc | head -1)" /data/graphhopper-web.jar
              cat /src/*.java | sha256sum > /data/src.sha
              # new code means new encoded values, so the graph must be rebuilt
              rm -rf /data/graph-cache
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: src, mountPath: /src }
        - name: download
          image: maven:3.9-eclipse-temurin-21
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              [ -f /data/planet.osm.pbf ] && { echo "planet exists, skip download"; exit 0; }
              curl -fsSL -A "ohm-routing-poc/0.1" -o /data/planet.tmp "$PLANET_URL"
              mv /data/planet.tmp /data/planet.osm.pbf
              ls -lh /data/planet.osm.pbf
          env:
            - name: PLANET_URL
              value: https://planet.openhistoricalmap.org/planet/planet-261016_0000.osm.pbf
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: graphhopper
          image: eclipse-temurin:21-jre
          command: ["java", "-Xms2g", "-Xmx10g", "-jar", "/data/graphhopper-web.jar", "server", "/config/config.yml"]
          ports:
            - { name: http, containerPort: 8989 }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { memory: 12Gi }
          startupProbe:
            httpGet: { path: /health, port: 8989 }
            periodSeconds: 30
            failureThreshold: 240
          readinessProbe:
            httpGet: { path: /health, port: 8989 }
            periodSeconds: 15
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: graphhopper-data }
        - name: src
          configMap: { name: graphhopper-ohm-src }
        - name: config
          configMap: { name: graphhopper-ohm-config }
---
apiVersion: v1
kind: Service
metadata:
  name: graphhopper
  namespace: routing-poc
spec:
  selector: { app: graphhopper }
  ports:
    - { name: http, port: 8989, targetPort: 8989 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-web
  namespace: routing-poc
spec:
  replicas: 1
  selector:
    matchLabels: { app: routing-web }
  template:
    metadata:
      labels: { app: routing-web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - { containerPort: 80 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: web, mountPath: /usr/share/nginx/html }
      volumes:
        - name: web
          configMap: { name: routing-web }
---
apiVersion: v1
kind: Service
metadata:
  name: routing-web
  namespace: routing-poc
spec:
  selector: { app: routing-web }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: routing
  namespace: routing-poc
spec:
  ingressClassName: traefik
  rules:
    - host: routing.ohmstaging.org
      http:
        paths:
          - { path: /route, pathType: Prefix, backend: { service: { name: graphhopper, port: { number: 8989 } } } }
          - { path: /info, pathType: Prefix, backend: { service: { name: graphhopper, port: { number: 8989 } } } }
          - { path: /health, pathType: Prefix, backend: { service: { name: graphhopper, port: { number: 8989 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: routing-web, port: { number: 80 } } } }
