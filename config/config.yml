graphhopper:
  datareader.file: /data/planet.osm.pbf
  graph.location: /data/graph-cache
  custom_models.directory: /config
  profiles:
    - name: car
      custom_model_files: [ohm_car.json]
    - name: foot
      custom_model_files: [ohm_foot.json]
  profiles_ch: []
  # LM keeps per-request custom models (the date filter) fast
  profiles_lm:
    - profile: car
    - profile: foot
  graph.encoded_values: car_access, car_average_speed, road_access, foot_access, foot_priority, foot_average_speed, road_class, road_environment, osm_way_id, ohm_start, ohm_end
  prepare.min_network_size: 200
  prepare.subnetworks.threads: 2
  prepare.lm.threads: 2
  import.osm.ignored_highways: proposed
  routing.snap_preventions_default: tunnel, bridge, ferry
  routing.non_ch.max_waypoint_distance: 1000000
  graph.dataaccess.default_type: RAM_STORE
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0
logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
