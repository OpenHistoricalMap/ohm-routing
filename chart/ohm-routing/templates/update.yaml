{{- if .Values.update.enabled }}
{{- $name := include "ohm-routing.fullname" . -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-update
  labels:
    {{- include "ohm-routing.labels" . | nindent 4 }}
    app.kubernetes.io/component: update
spec:
  schedule: {{ .Values.update.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "ohm-routing.labels" . | nindent 12 }}
            app.kubernetes.io/component: update
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $name }}-update
          {{- include "ohm-routing.scheduling" . | nindent 10 }}
          containers:
            - name: update
              image: {{ include "ohm-routing.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/app/scripts/update.sh"]
              env:
                - { name: JAVA_OPTS, value: {{ .Values.update.javaOpts | quote }} }
                - { name: FULL_REFRESH_DAYS, value: {{ .Values.update.fullRefreshDays | quote }} }
                - { name: REPLICATION_URL, value: {{ .Values.update.replicationUrl | quote }} }
                - { name: RESTART_DEPLOYMENT, value: {{ $name }}-server }
              resources:
                {{- toYaml .Values.update.resources | nindent 16 }}
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ $name }}-data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-update
  labels:
    {{- include "ohm-routing.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-update
  labels:
    {{- include "ohm-routing.labels" . | nindent 4 }}
rules:
  # Only to restart the server after a new graph is built
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["{{ $name }}-server"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-update
  labels:
    {{- include "ohm-routing.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-update
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-update
    namespace: {{ .Release.Namespace }}
{{- end }}
