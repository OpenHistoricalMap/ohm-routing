{{- if .Values.ingress.enabled }}
{{- $name := include "ohm-routing.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "ohm-routing.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range list "/route" "/info" "/health" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-server
                port: { name: http }
          {{- end }}
          {{- if $.Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-web
                port: { name: http }
          {{- end }}
{{- end }}
