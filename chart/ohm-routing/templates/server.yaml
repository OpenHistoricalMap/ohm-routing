{{- $name := include "ohm-routing.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-server
  labels:
    {{- include "ohm-routing.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  # The new pod loads the new graph before the old one stops, so restarts have no downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "ohm-routing.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- include "ohm-routing.scheduling" . | nindent 6 }}
      containers:
        - name: server
          image: {{ include "ohm-routing.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/scripts/start.sh"]
          env:
            - { name: JAVA_OPTS, value: {{ .Values.server.javaOpts | quote }} }
            - { name: REPLICATION_URL, value: {{ .Values.update.replicationUrl | quote }} }
          ports:
            - { name: http, containerPort: 8989 }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: {{ .Values.server.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.server.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: graph, mountPath: /tmp/graph }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        - name: graph
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-server
  labels:
    {{- include "ohm-routing.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - { name: http, port: 8989, targetPort: http }
